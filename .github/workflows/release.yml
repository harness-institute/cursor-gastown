name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch is only for rerunning a release from a v* tag. Publishing
  # jobs below are tag-gated and skip branch refs.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  goreleaser:
    if: ${{ github.repository == 'harness-institute/cursor-gastown' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'

      - name: Reject replace directives in go.mod
        run: |
          if grep -qE '^replace\s' go.mod; then
            echo "ERROR: go.mod contains replace directives — aborting release."
            echo "Replace directives break 'go install ...@latest'."
            echo "See: https://github.com/gastownhall/gastown/issues/2230"
            grep -n '^replace' go.mod
            exit 1
          fi

      - name: Verify tag matches Version constant
        run: make check-version-tag

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >
            release --clean
            ${{ github.repository != 'harness-institute/cursor-gastown' && '--skip=publish --skip=announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attest-release:
    if: ${{ github.repository == 'harness-institute/cursor-gastown' && startsWith(github.ref, 'refs/tags/v') }}
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve release asset paths
        id: assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          echo "checksums=dist/cursor-gastown_${version}_checksums.txt" >> "$GITHUB_OUTPUT"
          echo "sbom=dist/cursor-gastown-${GITHUB_REF_NAME}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "${GITHUB_REF_NAME}" --pattern "cursor-gastown_${version}_checksums.txt" --dir dist

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ steps.assets.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.assets.outputs.sbom }}" --clobber

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}

      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-checksums: ${{ steps.assets.outputs.checksums }}
          sbom-path: ${{ steps.assets.outputs.sbom }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: goreleaser
    if: ${{ github.repository == 'harness-institute/cursor-gastown' && startsWith(github.ref, 'refs/tags/v') }}
    # npm publish is best-effort — don't fail the release if npm is down or
    # the @harness-institute npm org isn't set up yet. GitHub release binaries
    # are the primary distribution channel.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write  # OIDC token for npm trusted publishing (no NPM_TOKEN needed)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for provenance support
        run: npm install -g npm@latest --min-release-age=7

      - name: Publish to npm
        run: |
          cd npm-package
          npm publish --access public --provenance
