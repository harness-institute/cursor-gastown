# GoReleaser configuration for Gas Town (gt)
# See https://goreleaser.com for documentation

version: 2

project_name: cursor-gastown

before:
  hooks:
    # Ensure dependencies are up to date
    - go mod tidy

builds:
  - id: gt-linux-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-linux-arm64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-darwin-amd64
    main: ./cmd/gt
    binary: gt
    env:
      # CGO off: Linux CI runners cannot cross-compile darwin cgo, and gt
      # runs dolt as an external process, so the ICU cgo path is not needed.
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-darwin-arm64
    main: ./cmd/gt
    binary: gt
    env:
      # CGO off: see gt-darwin-amd64 note.
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}

  - id: gt-windows-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}
      - -buildmode=exe

  - id: gt-freebsd-amd64
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos:
      - freebsd
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Version={{.Version}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Build={{.ShortCommit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Commit={{.Commit}}
      - -X github.com/harness-institute/cursor-gastown/internal/cmd.Branch={{.Branch}}


archives:
  - id: gt-archive
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "Features"
      regexp: '^.*feat(\(\w+\))?:.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*fix(\(\w+\))?:.*$'
      order: 1
    - title: "Others"
      order: 999

release:
  github:
    owner: harness-institute
    name: cursor-gastown
  draft: false
  prerelease: auto
  replace_existing_artifacts: true
  name_template: "v{{.Version}}"
  header: |
    ## Cursor Gas Town v{{.Version}}

    Pre-compiled binaries for Linux, macOS (Intel & Apple Silicon), and Windows.
    Based on upstream [gastownhall/gastown](https://github.com/gastownhall/gastown), tuned for the Cursor CLI.

    ### Installation

    **npm (Node.js):**
    ```bash
    npm install -g @harness-institute/cursor-gastown
    ```

    **From source (macOS; avoids Gatekeeper issues with unsigned binaries):**
    ```bash
    brew install dolt icu4c
    git clone https://github.com/harness-institute/cursor-gastown
    cd cursor-gastown && make install
    ```

    **Manual Install:**
    Download the appropriate binary for your platform below, extract it, and place it in your PATH.

# Announce the release
announce:
  skip: false
